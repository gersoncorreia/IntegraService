services:
  # 1. Aplicação Laravel 13 (PHP-FPM 8.4)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: integraservice_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./public/build:/var/www/html/public/build
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-integraservice}
      DB_USERNAME: ${DB_USERNAME:-integraservice_user}
      DB_PASSWORD: ${DB_PASSWORD:-Integre@Secret2026}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - integraservice_net

  # 2. Servidor Web Nginx (Alta Performance)
  webserver:
    image: nginx:1.27-alpine
    container_name: integraservice_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - integraservice_net

  # 3. Banco de Dados MySQL 8.0 (InnoDB + utf8mb4)
  db:
    image: mysql:8.0
    container_name: integraservice_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-integraservice}
      MYSQL_USER: ${DB_USERNAME:-integraservice_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Integre@Secret2026}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-Root@IntegreSecret2026}
    ports:
      - "${FORWARD_DB_PORT:-33060}:3306"
    volumes:
      - integraservice_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - integraservice_net

networks:
  integraservice_net:
    driver: bridge

volumes:
  integraservice_db_data:
    driver: local
